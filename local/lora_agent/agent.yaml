# raw_agent plus a LoRA adapter, to test adapter discovery and vLLM LoRA serving end to end.
# adapters/main_lora is generated by local/make_test_adapter.py for the base being served (zero effect).
name: lora_agent
model: gemma-4-31b-it-qat-w4a16-ct
adapter: main_lora
instruction: Resolve the issue in /workspace using the tools, then call submit_patch.
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
generate_content_config:
  temperature: 0.2
  top_p: 0.95
  max_output_tokens: 16384
  thinking_config:
    thinking_budget: 4096
    include_thoughts: true
